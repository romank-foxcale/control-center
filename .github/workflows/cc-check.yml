# The CC's own gates on every pull request: the same ./cc check a developer runs, from a fresh clone on Windows,
# macOS and Linux with nothing preinstalled (the shims fetch the pinned uv and Python), then a comparison of the
# tests each OS ran, and nix flake check for the optional Nix extra.
# Why: docs/kit/decisions/0021-cc-check-in-ci.md, docs/kit/decisions/0033-native-core-nix-optional.md
name: cc check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the stale-evidence warning (0023)
      - name: cc check
        if: runner.os != 'Windows'
        run: ./cc check
        env:
          CC_CHECK_SUMMARY: ${{ runner.temp }}/summary-${{ matrix.os }}.json
      - name: cc check (cc.cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: cc.cmd check
        env:
          CC_CHECK_SUMMARY: ${{ runner.temp }}\summary-${{ matrix.os }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summary-${{ matrix.os }}
          path: ${{ runner.temp }}/summary-${{ matrix.os }}.json
          if-no-files-found: error
      # The steps below run after ./cc check has written and uploaded its summary, so scripts/ci_compare.py never
      # sees them. They use the uv, Python and venv that ./cc check put in .cc-local; the runner's Python is not used.
      - name: hook launch test
        # Each rule hook of .claude/settings.json, launched as Claude Code does (sh -c, Git Bash on Windows), must deny
        # or ask within 5 s.
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python=.cc-local/venvs/windows/Scripts/python.exe ;;
            macOS) python=.cc-local/venvs/macos/bin/python ;;
            *) python=.cc-local/venvs/linux/bin/python ;;
          esac
          "$python" -B scripts/hook_launch_test.py
      - name: materialized CC keeps cc executable
        # On Windows git init sets core.filemode=false; the materialized CC must still record cc as 100755, or ./cc
        # and every hook fail with "Permission denied" in a macOS or Linux clone.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target="$RUNNER_TEMP/materialized-cc"
          .cc-local/venvs/windows/Scripts/python.exe -B scripts/materialize-template.py "$target"
          git -C "$target" add -A
          git -C "$target" -c user.name=ci -c user.email=ci@example.invalid commit -q -m "Materialize the CC"
          mode=$(git -C "$target" ls-files -s cc)
          echo "$mode"
          case "$mode" in
            100755\ *) ;;
            *) echo "cc is not committed as 100755 in the materialized CC" >&2; exit 1 ;;
          esac

  same-tests:
    # Every OS must run the same tests; a skip outside scripts/ci_compare.py's EXPECTED_SKIPS fails here.
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: true
      - run: python3 scripts/ci_compare.py summaries/*.json

  nix:
    # The optional Nix extra: the flake's checks, its Nix-only contract checks and the adapters' own checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix flake check --keep-going
